name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plans and file recovery on Debian 13
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install validation prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 tzdata ifupdown iproute2 systemd

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate project version
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          version = pathlib.Path("VERSION").read_text()
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?\n", version), version
          PY

      - name: Run planning and file-recovery tests as root
        run: python3 -m unittest discover -s tests -v

      - name: Run isolated regression tests as an ordinary user
        run: runuser -u nobody -- python3 -m unittest discover -s tests -v

      - name: Verify CLI help
        run: |
          python3 bootstrap.py --help
          python3 transaction.py --help
          python3 -I recovery.py --help

  recovery-integration:
    name: Exercise independent recovery with Debian systemd and kernel namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build disposable Debian 13 recovery environment
        run: docker build --tag rzandal-recovery-ci --file tests/integration/Dockerfile .

      - name: Start isolated systemd container
        run: |
          docker run --detach --name rzandal-recovery-ci --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock \
            --volume "$GITHUB_WORKSPACE:/opt/bootstrap:ro" \
            --env RZANDAL_RECOVERY_CI=1 rzandal-recovery-ci
          for attempt in $(seq 1 30); do
            if docker exec rzandal-recovery-ci test -S /run/dbus/system_bus_socket && \
              docker exec rzandal-recovery-ci systemctl show --property=UserspaceTimestampMonotonic --value; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Exercise reviewed Base and native APT in isolated target roots
        run: docker exec --workdir /opt/bootstrap rzandal-recovery-ci python3 tests/integration/base_application.py -v

      - name: Test owned network changes and independent recovery
        run: docker exec --workdir /opt/bootstrap rzandal-recovery-ci python3 tests/integration/kernel_recovery.py -v

      - name: Verify fresh SSH acknowledgment with real OpenSSH connections
        run: docker exec --workdir /opt/bootstrap rzandal-recovery-ci python3 tests/integration/ssh_acknowledgment.py -v

      - name: Verify owned temporary IPv6 probing and crash cleanup
        run: docker exec --workdir /opt/bootstrap rzandal-recovery-ci python3 tests/integration/ipv6_probe.py -v

      - name: Prepare an unresolved run then restart the system manager
        run: |
          docker exec --workdir /opt/bootstrap rzandal-recovery-ci python3 tests/integration/kernel_recovery.py prepare-boot
          docker restart --time 5 rzandal-recovery-ci
          for attempt in $(seq 1 30); do
            if docker exec rzandal-recovery-ci systemctl show --property=UserspaceTimestampMonotonic --value; then
              break
            fi
            sleep 1
          done
          docker exec --workdir /opt/bootstrap rzandal-recovery-ci python3 tests/integration/kernel_recovery.py verify-boot

      - name: Show recovery diagnostics
        if: failure()
        run: |
          docker logs rzandal-recovery-ci || true
          docker exec rzandal-recovery-ci journalctl --no-pager --unit 'rzandal-bootstrap-*' || true

      - name: Remove disposable environment
        if: always()
        run: docker rm --force rzandal-recovery-ci || true
