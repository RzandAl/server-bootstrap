name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate host plans on Debian 13
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install validation prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 tzdata ifupdown iproute2

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate project version
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          version = pathlib.Path("VERSION").read_text()
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?\n", version), version
          PY

      - name: Run planning and regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify CLI help
        run: python3 bootstrap.py --help
